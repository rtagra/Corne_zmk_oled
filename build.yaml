include:
  # Left Half (Peripheral)
  - board: nice_nano@2.0.0
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Right Half (Peripheral)
  - board: nice_nano@2.0.0
    shield: corne_right

  # Headless Dongle (Central)
  - board: seeed_xiao_ble
    shield: corne_dongle
    snippet: studio-rpc-usb-uart

  # Reset Images
  - board: nice_nano@2.0.0
    shield: settings_reset
  - board: seeed_xiao_ble
    shield: settings_reset
