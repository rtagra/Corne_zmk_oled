include:
  # Left Half (Peripheral)
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Right Half (Peripheral)
  - board: nice_nano_v2
    shield: corne_right

  # Headless Dongle (Central)
  - board: seeeduino_xiao_ble
    shield: corne_dongle
    snippet: studio-rpc-usb-uart

  # Reset Images (run first to clear previous pairing locks)
  - board: nice_nano_v2
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
