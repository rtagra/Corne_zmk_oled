# — Connectivity —————————————————————————————
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Radio transmit power: +8 dBm for a stronger split link to the dongle.
# The dongle was already at +8 dBm while the halves were at the default 0 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# — Peripheral Capacity ———————————————————————
# As peripherals, each half only pairs and connects to the central dongle
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Peripheral connection timing
# 7.5-15 ms split interval (was 20-40 ms) for faster, less stuttery key reports
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# — Power Management —————————————————————————
CONFIG_ZMK_SLEEP=y

# Screen blanks and board enters idle after 15 seconds of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Controller enters deep sleep after 20 minutes of inactivity (1,200,000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# — Pointing —————————————————————————————————
CONFIG_ZMK_POINTING=y

# — Display & Hardware ———————————————————————
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Cut power to external VCC line (display/LEDs) during deep sleep
CONFIG_ZMK_EXT_POWER=y
