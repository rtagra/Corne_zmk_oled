# — Connectivity —————————————————————————————
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# TX Power: boosted for stable connection across desk clutter
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# — Peripheral Capacity ———————————————————————
# As peripherals, each half only pairs and connects to the central dongle
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Peripheral connection timing
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=32
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# — Power Management —————————————————————————
CONFIG_ZMK_SLEEP=y
# 5 minutes to idle dim, 2 hours to deep sleep
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# — Pointing —————————————————————————————————
CONFIG_ZMK_POINTING=y

# — Display & Hardware ———————————————————————
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
