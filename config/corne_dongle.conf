# Role and Split Topology
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Accept connections from both left and right peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Headless: turn off display for the bare XIAO
CONFIG_ZMK_DISPLAY=n

# Max transmit power for dongle reception stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK Studio (runs over USB on the dongle)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
