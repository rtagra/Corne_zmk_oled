# ── Connectivity & Roles ──────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Max radio transmission power for lowest latency and dropped packets
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Clear bonds only during manual debug flashes
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# ── Connection Capacity ───────────────────────────────────
# 2 connections dedicated to split halves + 1 active host profile
CONFIG_BT_MAX_CONN=3
# 2 split halves + up to 5 paired host devices
CONFIG_BT_MAX_PAIRED=7

# ── Headless Power & Sleep ────────────────────────────────
# Headless USB dongles must stay awake at all times
CONFIG_ZMK_SLEEP=n

# ── Disable Unused Hardware Features ──────────────────────
# Strip display and battery drivers to save flash and CPU cycles
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n

# ── Studio & Pointing Support ─────────────────────────────
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_POINTING=y
